name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recipebook_test
          POSTGRES_USER: recipebook
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DB_CONNECTION: "Host=localhost;Port=5432;Database=recipebook_test;Username=recipebook;Password=test"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RecipeBook.slnx

      - name: Build
        run: dotnet build RecipeBook.slnx --no-restore --configuration Release

      - name: Test (Domain + Application — no infrastructure needed)
        run: |
          dotnet test RecipeBook.Domain.Tests --no-build --configuration Release \
            --logger "trx;LogFileName=domain-results.trx" \
            --collect:"XPlat Code Coverage"
          dotnet test RecipeBook.Application.Tests --no-build --configuration Release \
            --logger "trx;LogFileName=application-results.trx" \
            --collect:"XPlat Code Coverage"

      - name: Test (Infrastructure — requires PostgreSQL)
        run: |
          dotnet test RecipeBook.Infrastructure.Tests --no-build --configuration Release \
            --logger "trx;LogFileName=infrastructure-results.trx" \
            --collect:"XPlat Code Coverage"

      - name: Test (API integration)
        run: |
          dotnet test RecipeBook.Api.Tests --no-build --configuration Release \
            --logger "trx;LogFileName=api-results.trx" \
            --collect:"XPlat Code Coverage"

      - name: Test (Blazor components)
        run: |
          dotnet test RecipeBook.Blazor.Server.Tests --no-build --configuration Release \
            --logger "trx;LogFileName=blazor-results.trx" \
            --collect:"XPlat Code Coverage"

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx
