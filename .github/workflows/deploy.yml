name: Deploy to Azure

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ACR_REGISTRY: recipebookacr.azurecr.io
  API_IMAGE: recipebookacr.azurecr.io/recipebook-api
  BLAZOR_IMAGE: recipebookacr.azurecr.io/recipebook-blazor

jobs:
  # ── Step 1: Test gate (must pass before any deployment) ────────────────────
  test:
    name: Test Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recipebook_test
          POSTGRES_USER: recipebook
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore RecipeBook.slnx
      - run: dotnet test RecipeBook.slnx --configuration Release
        env:
          TEST_DB_CONNECTION: "Host=localhost;Port=5432;Database=recipebook_test;Username=recipebook;Password=test"

  # ── Step 2: Build and push container images ────────────────────────────────
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test

    permissions:
      id-token: write   # Required for OIDC auth to Azure
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name recipebookacr

      - name: Build & push API image
        run: |
          docker build \
            -f RecipeBook.Api/Dockerfile \
            -t ${{ env.API_IMAGE }}:${{ github.sha }} \
            -t ${{ env.API_IMAGE }}:latest \
            .
          docker push ${{ env.API_IMAGE }}:${{ github.sha }}
          docker push ${{ env.API_IMAGE }}:latest

      - name: Build & push Blazor image
        run: |
          docker build \
            -f RecipeBook.Blazor.Server/Dockerfile \
            -t ${{ env.BLAZOR_IMAGE }}:${{ github.sha }} \
            -t ${{ env.BLAZOR_IMAGE }}:latest \
            .
          docker push ${{ env.BLAZOR_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BLAZOR_IMAGE }}:latest

  # ── Step 3: Deploy API ─────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: build-images
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: recipebook-api
          images: ${{ env.API_IMAGE }}:${{ github.sha }}

  # ── Step 4: Deploy Blazor UI ───────────────────────────────────────────────
  deploy-blazor:
    name: Deploy Blazor UI
    runs-on: ubuntu-latest
    needs: deploy-api
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Blazor to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: recipebook-blazor
          images: ${{ env.BLAZOR_IMAGE }}:${{ github.sha }}
